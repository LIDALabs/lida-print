name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z), no release is published"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LidaPrint.exe
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser
          $version = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_VERSION } else { $env:REF_NAME.TrimStart("v") }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)?$') { throw "Invalid version: $version" }
          ./build/Build.ps1 -Version $version

      - name: Smoke check
        shell: pwsh
        run: |
          if (-not (Test-Path dist/LidaPrint.exe)) { throw "exe missing" }
          $sums = Get-Content dist/SHA256SUMS.txt -Raw
          $hash = (Get-FileHash dist/LidaPrint.exe -Algorithm SHA256).Hash
          if ($sums -notmatch $hash) { throw "hash mismatch" }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LidaPrint.exe
            dist/SHA256SUMS.txt
